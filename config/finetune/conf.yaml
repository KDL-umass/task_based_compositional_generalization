# Location to store checkpoints
seed: 0

prompt_length: 'fixed'  # 'fixed' or 'variable'
n_alphabets: 26        # Total number of tokens "a-z" + " "
seq_len: 6              # Length of tokens in data prompt
n_functions: 6  # Number of maximum functions per composition
model_name: "granite"
function_type: "uniform"
device : "cuda"
bf16: True
epochs: 10
data_path: "/work/pi_jensen_umass_edu/ppruthi_umass_edu/task_based_compositional_generalization/data/uniform/fixed/nalph_26_seqlen_6_fnlen_6_taskmaxlen_6/direct/combination_6"
output_dir: "/work/pi_jensen_umass_edu/ppruthi_umass_edu/task_based_compositional_generalization/models/ckpts/uniform/fixed/nalph_26_seqlen_6_fnlen_6_taskmaxlen_6/direct/combination_6/granite"
mode: "direct"
train_split: "combination_6"
task_max_length: 6
num_workers: 4
batch_size: 1

net:
  compile: False
  prompt_length: "fixed"
  pos_embedding_type: "abs"

optimizer:
  learning_rate: 0.00002
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  decay_lr: True
  warmup_iters: 500
  min_lr: 0.000006

log: 
  eval_interval: 500
  log_interval: 1
